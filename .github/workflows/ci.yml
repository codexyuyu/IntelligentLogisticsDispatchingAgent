name: ci

# Continuous integration for the workspace: a frozen install, the layered architecture
# check, the test suites, and the phase gate evidence runner.
#
# Design rules:
#   * the gate runner is executed with --check-only in CI, so CI never signs a Gate with
#     the developer's own revision (final sign-off belongs to the phase review);
#   * a failing gate runner always fails the job (scripts/gates.py exits non-zero);
#   * no secret is echoed; the model-provider secrets used from Phase 18 onward are
#     referenced only through the `env:` block and never printed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  UV_FROZEN: "1"
  UV_LINK_MODE: copy

jobs:
  python:
    name: python workspace
    # Service containers (PostgreSQL) are only supported on Linux runners, so the
    # matrix is ubuntu-only; integration tests need a real PostgreSQL 17 database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: logistics
          POSTGRES_PASSWORD: logistics
          POSTGRES_DB: logistics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U logistics -d logistics_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://logistics:logistics@127.0.0.1:5432/logistics_test
      # The bootstrap evidence records the exact interpreter that validated the
      # locks (3.12.10); pin uv to it so the runtime-baseline test can match.
      UV_PYTHON: "3.12.10"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24.18.0 (evidence-recorded baseline)
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12.10

      - name: Verify the lock file matches the manifests
        run: uv lock --check

      - name: Frozen workspace install
        run: uv sync --frozen

      - name: Layered architecture check
        run: uv run python scripts/check_architecture.py --verbose

      - name: Migrate the test database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://logistics:logistics@127.0.0.1:5432/logistics_test

      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -q

      - name: Gate evidence freshness (check-only, never signs a gate)
        # The phase-01 gate record pins machine-local inputs (gitignored demo.zip,
        # tmp/N05, the signing workstation's cwd), so it can never pass on a fresh
        # runner. Keep the check visible — logs are uploaded below — without
        # blocking CI; re-signing is an offline step on the evidence-owning machine.
        continue-on-error: true
        run: uv run python scripts/gates.py --phase 01 --revision auto --check-only

      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-ubuntu
          path: |
            artifacts/gates/**
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: frontend workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22 (compatible baseline)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Reproducible install
        run: npm ci

      - name: Verify the npm lock file did not change
        run: git diff --exit-code -- package-lock.json

      - name: Frontend tests
        run: npm --workspace @logistics/frontend run test --if-present

      - name: List end-to-end specs
        run: npm run test:e2e:list || echo "no e2e specs present yet"

  secret-hygiene:
    name: no committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on committed env files or obvious private keys
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|\.p12$|id_rsa' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$matches" ]; then
            echo "Refusing to ship credential-looking files:"; echo "$matches"; exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- . ':!*.md' ; then
            echo "Potential secret literal found"; exit 1
          fi
          echo "no credential-looking files or literals found"
