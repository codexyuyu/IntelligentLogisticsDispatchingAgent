[project]
name = "logistics-evaluation"
version = "0.1.0"
description = "Metric definitions, calculators, version comparison and paired-seed experiment policies."
requires-python = ">=3.12,<3.13"
dependencies = [
    "logistics-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
logistics-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/logistics_evaluation"]
